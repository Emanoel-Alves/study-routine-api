services:
  - type: web
    name: study-routine-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: study_routine
      - key: JWT_SECRET
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
